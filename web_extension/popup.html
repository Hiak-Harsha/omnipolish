<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-badge.online {
      background: #064e3b;
      color: #34d399;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin: 12px 0 6px 0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .toggle-label {
      font-size: 12px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(16px); }

    label {
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
    }
    select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      padding: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .button-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      background: #0284c7;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      padding: 8px 12px;
      border-radius: 6px;
    }
    button:hover { background: #0369a1; }
    button.prompt-btn {
      background: #7e22ce;
    }
    button.prompt-btn:hover { background: #6b21a8; }

    .cheat-sheet {
      background: #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
    }
    .cheat-sheet-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .cheat-sheet-row:last-child { margin-bottom: 0; }
    kbd {
      background: #334155;
      color: #f8fafc;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>✨ OmniPolish</h3>
    <div id="status" class="status-badge">Checking...</div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">✨ Floating Pill on Inputs</span>
    <label class="switch">
      <input type="checkbox" id="pillToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <label for="mode">Highlighting & Format Style:</label>
  <select id="mode">
    <option value="auto">Auto-detect</option>
    <option value="whatsapp">WhatsApp (*bold*, emojis)</option>
    <option value="markdown">Markdown (**bold**, bullets)</option>
    <option value="plain">Plain Text (Clean bullets, uppercase)</option>
  </select>

  <div class="section-title">Quick Test Sandbox</div>
  <textarea id="testInput" rows="3" placeholder="Type a message or rough prompt to test..."></textarea>
  
  <div class="button-group">
    <button id="polishBtn">💬 Polish Message</button>
    <button id="promptBtn" class="prompt-btn">🧠 Supercharge</button>
  </div>

  <div class="cheat-sheet">
    <div class="cheat-sheet-row">
      <span>💬 Polish & Highlight</span>
      <kbd>Alt + Q</kbd>
    </div>
    <div class="cheat-sheet-row">
      <span>🧠 Supercharge Prompt</span>
      <kbd>Alt + P</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
