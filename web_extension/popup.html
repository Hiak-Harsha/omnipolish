<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 12px;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-badge.online {
      background: #064e3b;
      color: #34d399;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
    }
    select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      padding: 8px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      background: #0284c7;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .shortcut-hint {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>✨ OmniPolish</h3>
  <div id="status" class="status-badge">Checking daemon...</div>

  <label for="mode">Highlighting & Format Style:</label>
  <select id="mode">
    <option value="auto">Auto-detect</option>
    <option value="whatsapp">WhatsApp (*bold*, emojis)</option>
    <option value="markdown">Markdown (**bold**, bullets)</option>
    <option value="plain">Plain Text (Clean bullets, uppercase)</option>
  </select>

  <label for="testInput">Quick Polish Test:</label>
  <textarea id="testInput" rows="3" placeholder="Type a messy message here..."></textarea>
  <button id="polishBtn">Polish Message</button>

  <div class="shortcut-hint">
    Shortcut inside web inputs: <kbd>Alt + R</kbd>
  </div>

  <script src="popup.js"></script>
</body>
</html>
