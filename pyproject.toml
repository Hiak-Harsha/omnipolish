[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipolish"
version = "1.0.0"
description = "Universal AI Text Autocorrector, Formatter & Key Point Highlighter"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "requests>=2.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0"
]

[project.scripts]
omnipolish = "omnipolish.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
